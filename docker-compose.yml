version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: globetrotter
      POSTGRES_PASSWORD: globetrotter_password
      POSTGRES_DB: globetrotter_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globetrotter"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000
    volumes:
      - ./backend:/app
      # Exclude local ML models folder to allow docker container to build/train its own or map it
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://globetrotter:globetrotter_password@db:5432/globetrotter_db
      - SECRET_KEY=super_secret_jwt_key_globetrotter_2026_change_in_prod
      - BACKEND_CORS_ORIGINS=*
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
